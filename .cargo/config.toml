[target.'cfg(target_os="macos")']
# Postgres symbols won't be available until runtime
# TODO: building with a large feature set (e.g. `--features native_fdws`) on macOS
# trips Xcode's newer linker's 16MB compact-unwind table limit, producing a
# "__eh_frame section too large" warning. Workaround is `-Wl,-ld_classic`, but
# that linker is itself deprecated and slated for removal, so leaving as-is for
# now rather than swapping one warning for another (https://developer.apple.com/forums/thread/737707).
rustflags = ["-Clink-arg=-Wl,-undefined,dynamic_lookup"]

[target.'cfg(target_os="linux")']
# Postgres symbols won't be available until runtime. Also strip unreachable
# dead code at link time (--gc-sections): without it, `cargo test --lib`
# links in library code that references real Postgres globals (e.g.
# CurrentMemoryContext) which only exist inside a running postgres process.
# Those are data-symbol relocations, resolved eagerly regardless of any lazy-
# binding flag, so the standalone test binary fails to even start unless the
# unreached code referencing them is gc'd away.
rustflags = ["-Clink-arg=-Wl,--unresolved-symbols=ignore-all", "-Clink-arg=-Wl,--gc-sections"]