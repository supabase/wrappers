name: Test Wrappers
on:
  pull_request:
    paths:
      - "supabase-wrappers/**"
      - "supabase-wrappers-macros/**"
      - ".github/workflows/test_supabase_wrappers.yml"
  push:
    branches:
      - main
    paths:
      - "supabase-wrappers/**"
      - "supabase-wrappers-macros/**"
      - ".github/workflows/test_supabase_wrappers.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run supabase_wrappers tests
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - run: |
          sudo apt remove -y postgres*
          sudo apt -y install curl ca-certificates build-essential pkg-config libssl-dev
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo sh -c "echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo apt update -y -qq --fix-missing
          sudo apt -y install postgresql-client-15 postgresql-15 postgresql-server-dev-15
          sudo apt -y autoremove && sudo apt -y clean
          sudo chmod a+rwx `/usr/lib/postgresql/15/bin/pg_config --pkglibdir` `/usr/lib/postgresql/15/bin/pg_config --sharedir`/extension /var/run/postgresql/

      - run: cargo install --locked cargo-pgrx --version 0.19.2
      - run: cargo pgrx init --pg15 /usr/lib/postgresql/15/bin/pg_config

      - name: Format code
        run: |
          cd supabase-wrappers && cargo fmt --check

      - name: Run clippy
        run: |
          # wasm-wrappers/fdw crates are now members of the root workspace, but their
          # src/bindings.rs (WIT bindings) is only generated by the test_wasm job's
          # `cargo component build` step, so --workspace here must exclude them.
          cd supabase-wrappers && RUSTFLAGS="-D warnings" cargo clippy --workspace \
            --exclude cal_fdw --exclude calendly_fdw --exclude cfd1_fdw --exclude clerk_fdw \
            --exclude helloworld_fdw --exclude hubspot_fdw --exclude infura_fdw --exclude langfuse_fdw \
            --exclude notion_fdw --exclude openapi_fdw --exclude orb_fdw --exclude paddle_fdw \
            --exclude shopify_fdw --exclude slack_fdw --exclude snowflake_fdw \
            --tests --no-deps

      - name: Run tests
        env:
          RUSTFLAGS: "-D warnings -Clink-arg=-Wl,--unresolved-symbols=ignore-all"
        run: cargo test -p supabase-wrappers --no-default-features --features pg15 --lib
